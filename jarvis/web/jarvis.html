<title>Jarvis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column; orb + status up top, conversation below, composer pinned to the bottom. */
:root {
  --bg: #f4f6f5; --panel: #ffffff; --line: #d7dfdc; --fg: #142320; --muted: #44564f;
  --accent: #127a6c; --accent-ink: #ffffff; --user: #e3ece9; --danger: #b3372e;
  --orb-a: #5ed6c4; --orb-b: #0d3833;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Space Grotesk", var(--font);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1413; --panel: #18201f; --line: #2c3836; --fg: #ecf1ef; --muted: #9fb0ac;
  --accent: #5ed6c4; --accent-ink: #062320; --user: #1f2a28; --danger: #ff8a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1413; --panel: #18201f; --line: #2c3836; --fg: #ecf1ef; --muted: #9fb0ac;
  --accent: #5ed6c4; --accent-ink: #062320; --user: #1f2a28; --danger: #ff8a80; color-scheme: dark }
body[data-state="listening"] { --orb-a: #96ec80; }
body[data-state="thinking"] { --orb-a: #aa92ff; }
body[data-state="speaking"] { --orb-a: #ffb668; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
.wrap { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 0; }
header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h1 { font: 650 18px/1 var(--display); margin: 0; letter-spacing: .01em; }
.pick { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
select, textarea, button { font: inherit; color: inherit; }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
.stage { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0 6px; }
.orb { width: 132px; height: 132px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
  background: radial-gradient(circle at 36% 32%, #fff 0 6%, var(--orb-a) 34%, var(--orb-b) 100%);
  box-shadow: 0 0 40px color-mix(in srgb, var(--orb-a) 45%, transparent); transition: background .4s, box-shadow .4s; }
.orb:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
body[data-state="idle"] .orb { animation: breathe 4.2s ease-in-out infinite; }
body[data-state="listening"] .orb { animation: ripple 1.1s ease-out infinite; }
body[data-state="thinking"] .orb { animation: spin 1.6s linear infinite; background: conic-gradient(from 0deg, var(--orb-a), var(--orb-b), var(--orb-a)); }
body[data-state="speaking"] .orb { animation: talk .5s ease-in-out infinite alternate; }
@keyframes breathe { 50% { transform: scale(1.04); } }
@keyframes ripple { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--orb-a) 60%, transparent); } 100% { box-shadow: 0 0 0 26px transparent; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes talk { to { transform: scale(1.07, .95); } }
body.still .orb { animation: none !important; }
@media (prefers-reduced-motion: reduce) { .orb { animation: none !important; } }
.status { font-weight: 560; min-height: 1.5em; text-align: center; }
.live { color: var(--muted); font-style: italic; min-height: 1.5em; text-align: center; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 16px; cursor: pointer; font-weight: 560; min-height: 42px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.log { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.msg { min-width: 0; }
.msg.user { align-self: flex-end; max-width: 85%; background: var(--user); border-radius: 16px 16px 4px 16px; padding: 9px 14px; }
.msg.assistant .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
.msg.err .text { color: var(--danger); }
.empty { color: var(--muted); text-align: center; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
form { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: flex-end; background: var(--bg);
  padding-block: 10px max(10px, env(safe-area-inset-bottom, 0px)); margin-top: 12px; }
textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--panel); border-radius: 20px; padding: 10px 14px; max-height: 180px; }
textarea:focus { outline: none; border-color: var(--accent); }
.note { font-size: 13px; color: var(--muted); text-align: center; }
</style>

<div class="wrap">
  <header>
    <h1>Jarvis</h1>
    <div class="pick">
      <label class="sr" for="model" hidden>Model</label>
      <select id="model" aria-label="Model">
        <option value="auto">Auto</option>
        <option value="claude-opus-5-5">Claude Opus 5.5</option>
        <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
        <option value="claude-haiku-5-5">Claude Haiku 5.5</option>
      </select>
      <select id="effort" aria-label="Reasoning effort">
        <option value="">Default effort</option>
        <option value="low">Low effort</option>
        <option value="medium">Medium effort</option>
        <option value="high">High effort</option>
      </select>
      <button class="btn" id="motion" type="button" aria-pressed="false">Animations on</button>
    </div>
  </header>

  <section class="stage" aria-label="Jarvis">
    <button class="orb" id="orb" type="button" aria-label="Talk to Jarvis"></button>
    <div class="status" id="status" role="status" aria-live="polite">Ready. Talk or type to start.</div>
    <div class="live" id="live" aria-live="polite"></div>
    <div class="row">
      <button class="btn primary" id="talk" type="button">Talk to Jarvis</button>
      <button class="btn" id="stop" type="button" hidden>Stop</button>
      <label class="btn"><input type="checkbox" id="speakOn" checked> Read replies aloud</label>
      <button class="btn" id="end" type="button">End conversation</button>
    </div>
    <div class="note" id="note"></div>
  </section>

  <ol class="log" id="log"></ol>
  <p class="empty" id="empty">Say or type a rough idea, like "I want to build a tool for my running club". Jarvis asks one question at a time, then sums up your goal and a next step.</p>
  <div class="chips" id="chips"></div>

  <form id="form">
    <label for="input" hidden>Message Jarvis</label>
    <textarea id="input" rows="1" placeholder="Message Jarvis…"></textarea>
    <button class="btn primary" type="submit" id="send">Send</button>
  </form>
</div>

<script>
const INSTRUCTIONS = `You are Jarvis, a warm, sharp thinking partner who helps people turn rough ideas into something concrete.
- While the idea is fuzzy, ask exactly ONE short, useful question per reply, building on the person's own words.
- After a question, end with 2 to 4 short optional answers they might give, grounded in what they said, on the final line exactly like: <replies>["first", "second"]</replies>
- Once you understand the goal, who it is for and a constraint, stop asking. Reply with "Your goal, in your words:" reusing their phrasing, then "Suggested next step:" with one concrete action for today.
- Answer direct questions plainly. Keep replies short and conversational; they may be read aloud. No markdown tables or headings.`;

const $ = (id) => document.getElementById(id);
const turns = [];          // [{role, content, model?}]
let sample = null, tts = null, dict = null, ctl = null, phase = 'idle';

function setPhase(p, text) {
  phase = p; document.body.dataset.state = p;
  $('status').textContent = text || { idle: turns.length ? 'Your turn.' : 'Ready. Talk or type to start.', listening: 'Listening… tap the orb when you finish.', thinking: 'Thinking…', speaking: 'Speaking. Tap the orb to interrupt.' }[p];
  $('stop').hidden = !(p === 'thinking' || p === 'speaking' || p === 'listening');
  $('talk').disabled = p === 'thinking';
}

function parse(raw) {
  let replies = [];
  const m = raw.match(/<replies>([\s\S]*?)<\/replies>/i);
  if (m) { try { replies = JSON.parse(m[1]).map(String).slice(0, 4); } catch {} }
  const text = raw.replace(/<replies>[\s\S]*?(<\/replies>|$)/i, '').trim();
  return { text, replies };
}

function autoModel(text) {
  const t = text.toLowerCase(), words = t.split(/\s+/).length;
  if (/\b(plan|strategy|compare|trade-?offs?|why|analy[sz]e|code|bug|function)\b/.test(t) || words > 80) return ['claude-opus-5-5', 'it looked like planning, reasoning or code'];
  if (words <= 6 && turns.length) return ['claude-haiku-5-5', 'it was a quick reply'];
  return ['claude-sonnet-5-5', 'it was an open conversation'];
}

function render() {
  const log = $('log'); log.replaceChildren();
  $('empty').hidden = turns.length > 0;
  for (const t of turns) {
    const li = document.createElement('li');
    li.className = `msg ${t.role}${t.err ? ' err' : ''}`;
    const tx = document.createElement('div'); tx.className = 'text'; tx.textContent = t.content; li.append(tx);
    if (t.meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = t.meta; li.append(m); }
    log.append(li);
  }
  log.lastElementChild?.scrollIntoView({ block: 'nearest' });
}

function chips(list) {
  const box = $('chips'); box.replaceChildren();
  for (const r of list) { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = r; b.onclick = () => send(r, false); box.append(b); }
}

async function send(text, spoken) {
  text = String(text || '').trim();
  if (!text || phase === 'thinking') return;
  if (!sample) { $('note').textContent = 'Claude isn’t available in this view. Open the artifact on claude.ai while signed in.'; return; }
  tts?.stop?.();
  chips([]);
  turns.push({ role: 'user', content: text });
  const pick = $('model').value;
  const [model, why] = pick === 'auto' ? autoModel(text) : [pick, null];
  const reply = { role: 'assistant', content: '', meta: 'Thinking…' };
  turns.push(reply); render(); setPhase('thinking');
  const history = turns.slice(0, -1).filter((t) => !t.err).map((t) => ({ role: t.role, content: t.content }));
  history[0] = { role: 'user', content: INSTRUCTIONS + '\n\n---\n\n' + history[0].content };
  ctl = new AbortController();
  const opts = { signal: ctl.signal, cache: false, model, onText: ({ text }) => { reply.content = parse(text).text; reply.meta = ''; render(); } };
  if ($('effort').value) opts.effort = $('effort').value;
  try {
    const res = await sample(history, opts);
    const p = parse(res.text);
    reply.content = p.text || '(No reply.)';
    const used = res.modelApplied || model;
    reply.meta = `Answered by ${used}` + (why ? ` · Auto chose it because ${why}` : '') + (res.truncated ? ' · cut off' : '');
    render(); chips(p.replies);
    if ($('speakOn').checked && tts && p.text) {
      setPhase('speaking');
      try { await tts.speak(p.text.slice(0, 2000)); } catch {}
      if (phase === 'speaking') setPhase('idle');
    } else setPhase('idle');
  } catch (e) {
    turns.pop(); turns.pop();
    const keep = e.code === 'aborted' ? 'Stopped.' : e.code === 'not_granted' ? 'Allow Jarvis to use Claude to get replies.' : e.code === 'rate_limited' ? 'Too many requests. Wait a moment, then send again.' : `Claude couldn’t answer (${e.code || 'error'}).`;
    $('input').value = text;
    turns.push({ role: 'assistant', content: keep + ' Your message is back in the box.', err: true });
    render(); setPhase('idle');
  } finally { ctl = null; }
}

$('form').onsubmit = (e) => { e.preventDefault(); const v = $('input').value; $('input').value = ''; send(v, false); };
$('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); } };
$('stop').onclick = () => { if (phase === 'thinking') ctl?.abort(); else if (phase === 'speaking') { tts?.stop?.(); setPhase('idle', 'Interrupted. Your turn.'); } else if (phase === 'listening') dict?.stop?.(); };
$('end').onclick = () => { ctl?.abort(); tts?.stop?.(); dict?.stop?.(); turns.length = 0; chips([]); render(); setPhase('idle', 'Conversation ended.'); };
$('motion').onclick = () => { const off = document.body.classList.toggle('still'); $('motion').textContent = off ? 'Animations off' : 'Animations on'; $('motion').setAttribute('aria-pressed', String(off)); };

let heard = '';
function talk() {
  if (phase === 'speaking') { tts?.stop?.(); setPhase('idle', 'Interrupted. Your turn.'); }
  if (phase === 'listening') { dict.stop(); return; }
  if (phase === 'thinking') { ctl?.abort(); return; }
  if (!dict) { $('note').textContent = 'Voice input isn’t available here (it needs Chrome or the Claude desktop app). Type instead.'; $('input').focus(); return; }
  heard = ''; $('live').textContent = '';
  dict.start().catch((e) => { $('note').textContent = e.code === 'not_granted' ? 'Microphone not allowed. You can type instead.' : 'Voice input couldn’t start. You can type instead.'; setPhase('idle'); });
}
$('talk').onclick = talk;
$('orb').onclick = talk;

(async () => {
  setPhase('idle');
  sample = await claude.use('sample');
  if (!sample) $('note').textContent = 'Claude isn’t available in this view. Open the artifact on claude.ai while signed in.';
  tts = await claude.use('tts');
  if (tts) tts.onState(({ state }) => { if (state === 'idle' && phase === 'speaking') setPhase('idle'); });
  else $('speakOn').closest('label').hidden = true;
  dict = await claude.use('dictation');
  if (dict) {
    dict.onPartial(({ text }) => { $('live').textContent = (heard + ' ' + text).trim(); });
    dict.onFinal(({ text }) => { heard = (heard + ' ' + text).trim(); $('live').textContent = heard; });
    dict.onState(({ state }) => {
      if (state === 'listening') setPhase('listening');
      else if (state === 'idle' && phase === 'listening') { const t = heard; $('live').textContent = ''; setPhase('idle'); if (t) send(t, true); }
    });
  }
})();
</script>
